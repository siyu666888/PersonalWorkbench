name: Bug 报告
description: 报告一个可复现的问题（崩溃 / 结果错误 / 界面异常）
labels: [ "bug" ]
body:
  - type: markdown
    attributes:
      value: |
        提交前请确认：
        - 已在 [Issues](../../issues) 搜索过，没有重复报告；
        - 使用的是最新版本（见「我的 - 关于」中的版本号）。
        感谢帮助改进 PersonalWorkbench！

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 简明扼要地说明问题是什么
      placeholder: 例：待办列表左滑删除后，撤销提示不出现
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      description: 列出可稳定复现的操作路径
      placeholder: |
        1. 进入「待办」页
        2. 左滑任意一条待办
        3. 观察底部提示条
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 说明你认为正确的结果
    validations:
      required: true

  - type: dropdown
    id: module
    attributes:
      label: 涉及模块
      multiple: true
      options:
        - 首页 / 快捷入口
        - 待办
        - 日程 / 日历
        - 笔记
        - 目标 / 打卡
        - 工程项目
        - 文件管理
        - 日志 / 报表
        - AI 助手
        - 备份 / 恢复
        - 提醒 / 通知
        - 其他
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: App 版本
      description: 「我的 - 关于」中查看，如 1.6.0
      placeholder: "1.6.0"
    validations:
      required: true

  - type: dropdown
    id: android-version
    attributes:
      label: Android 版本
      options:
        - Android 16 (API 36)
        - Android 15 (API 35)
        - Android 14 (API 34)
        - Android 13 (API 33)
        - Android 12 (API 31/32)
        - Android 11 (API 30)
        - Android 10 (API 29)
        - Android 9 (API 28)
        - Android 8.0/8.1 (API 26/27)
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: 设备型号
      placeholder: 例：Pixel 6 / 小米 12 / 华为 Mate40
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: 崩溃日志（如适用）
      description: 在「我的 - 崩溃日志」中查看并粘贴；没有可留空
      render: shell
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: 截图 / 录屏 / 补充说明
      description: 可直接拖入图片，说明任何可能有用的上下文
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前自查
      options:
        - label: 我已搜索现有 Issues，确认不是重复报告
          required: true
        - label: 我描述的是可复现的行为，而非一次性异常
          required: false
