name: 功能建议
description: 提出新功能或改进想法
labels: [ "enhancement" ]
body:
  - type: markdown
    attributes:
      value: |
        欢迎任何想法！提交前请先搜索现有 Issues，避免重复建议。
        大改动（新模块 / 数据模型调整）建议先到 [Discussions](../../discussions) 讨论再落 Issue。

  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 描述当前的痛点或使用场景，而非直接描述方案
      placeholder: 例：每天要在工程模块和日志模块之间切换，看不到今天的现场动态
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 你期望的交互或结果；有原型图 / 参考 App 更好
      placeholder: 例：首页「今日焦点」增加工程项目区块，展示今日日报与现场问题
    validations:
      required: true

  - type: dropdown
    id: module
    attributes:
      label: 涉及模块
      multiple: true
      options:
        - 首页 / 快捷入口
        - 待办
        - 日程 / 日历
        - 笔记
        - 目标 / 打卡
        - 工程项目
        - 文件管理
        - 日志 / 报表
        - AI 助手
        - 备份 / 恢复
        - 提醒 / 通知
        - 桌面版
        - 新模块建议
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: 对你的重要程度
      options:
        - 有了会每天用（强烈需要）
        - 有了更好（锦上添花）
        - 无所谓（聊聊而已）
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 是否有其他变通做法 / 为什么不够好
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前自查
      options:
        - label: 我已搜索现有 Issues / Discussions，确认没有重复建议
          required: true
        - label: 我愿意参与该功能的讨论或测试
          required: false
