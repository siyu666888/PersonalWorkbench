name: Android CI

# T1：初始化 Git 仓库 + GitHub Actions 流水线（V1.6.0 后续建议）
# - push/PR 到主分支：跑单元测试(Robolectric) + 构建 debug 包（无需密钥）
# - 配置了 GitHub Secrets 后：额外构建并校验签名 release 包，作为产物上传
#   所需 Secrets（仓库 Settings → Secrets → Actions）：
#     KEYSTORE_BASE64    : 本地 release keystore 的 base64（例如 certutil -encode release.jks release.b64 后去掉首尾行）
#     KEYSTORE_PASSWORD  : keystore.properties 中的 storePassword
#     KEY_ALIAS          : keystore.properties 中的 keyAlias
#     KEY_PASSWORD       : keystore.properties 中的 keyPassword
#   未配置 Secrets 时，release 步骤自动跳过，CI 仍可正常通过（适合 fork / 外部 PR）。

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 注意：if 条件里不允许用 secrets 上下文（Unrecognized named-value），
    # 标准做法是先在 job 级 env 里求值，步骤里改判 env 变量
    env:
      HAS_RELEASE_SECRETS: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ubuntu-latest 镜像已预装 Android SDK（ANDROID_HOME=/usr/local/lib/android/sdk），
      # 无需 android-actions/setup-android（其新版会装已废弃的 tools 包而失败），
      # 只需用预装 sdkmanager 补齐本项目所需的 platform/build-tools 并接受许可
      - name: Install SDK packages & accept licenses
        run: |
          SDKM="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests (Robolectric)
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      # 桌面端（Compose Multiplatform）与主工程完全独立、此前从未被 CI 构建，
      # 导致 :app 改动造成的桌面端编译漂移无人知晓。此处至少保证它能编译。
      - name: Compile desktop module (Compose Multiplatform)
        run: ./gradlew :desktop:compileKotlin --no-daemon

      - name: Build & sign release APK (requires secrets)
        if: env.HAS_RELEASE_SECRETS == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "${{ github.workspace }}/release-key.jks"
          cat > keystore.properties <<EOF
          storeFile=${{ github.workspace }}/release-key.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          ./gradlew assembleRelease --no-daemon
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify app/build/outputs/apk/release/*.apk

      # Baseline Profile 属于「丢了也不报错」的东西：R8 规则调整、依赖升级、sourceSet 改名
      # 都可能让它静默消失，包照样能装但性能收益归零。这里显式断言一次。
      - name: Verify baseline profile packaged
        if: env.HAS_RELEASE_SECRETS == 'true'
        run: unzip -l app/build/outputs/apk/release/*.apk | grep -q "assets/dexopt/baseline.prof"

      - name: Upload APK artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
