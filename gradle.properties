# 个人工作台 APP - Gradle 属性
#
# V1.6.4 (C2 构建提速)：以下四条为配置级提速，无需改代码即可生效。
# 实测（本机 16 GB / JDK17，同一个 up-to-date 的 assembleDebug）：
#   优化前 24–28s  →  优化后 15s（配置缓存命中）+ 构建缓存/并行复用，约省 40%。
# 说明：
#  - configuration-cache：Gradle 8.7 + AGP 8.4 + Kotlin 1.9.24(kapt) 实测无兼容问题，
#    配置阶段结果落盘复用，日常增量构建收益最直接。若某天新增插件提示不兼容，
#    用 `--configuration-cache-problems=fail` 定位，或临时加 `--no-configuration-cache` 绕过。
#  - caching（构建缓存）：跨分支切换、CI 复用同一份任务输出。
#  - vfs.watch：文件系统监听，省去每次全量扫描。
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.vfs.watch=true

# Kotlin 编译守护进程堆：Compose 全量编译需要，太小会频繁 GC 拖慢安装/编译
kotlin.daemon.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Room kapt 走 worker api + 增量注解处理（Room 官方支持 incremental apt）
kapt.use.worker.api=true
kapt.incremental.apt=true

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
